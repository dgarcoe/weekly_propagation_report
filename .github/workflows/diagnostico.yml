name: Diagnóstico de fuentes

# Comprueba desde el runner (que sí tiene red) qué URLs responden y con qué formato.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnostico.yml"]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Redirección de GIRO scaled.php (ronda 5)
        run: |
          U=https://giro.uml.edu/didbase/scaled.php
          curl -s --max-time 120 -D /tmp/h -o /tmp/b "$U" \
            --data-urlencode "location=EA036" --data-urlencode "chosenchars[]=0" \
            --data-urlencode "date_start=2026-09-20 00:00" --data-urlencode "date_end=2026-09-20 06:00" \
            --data-urlencode "DMUF=3000" --data-urlencode "query_submit=Search"
          echo "---- cabeceras"; cat /tmp/h
          echo "---- cuerpo"; head -c 1500 /tmp/b; echo
          LOC=$(grep -i '^location:' /tmp/h | tail -1 | cut -d' ' -f2- | tr -d '\r')
          if [ -z "$LOC" ]; then LOC=$(grep -oiE '(url=|href=")[^"]*DIDB[^"]*' /tmp/b | head -1 | sed -E 's/^(url=|href=")//'); fi
          echo "---- destino: $LOC"
          if [ -n "$LOC" ]; then
            curl -sL --max-time 120 "$LOC" -o /tmp/r -w 'HTTP %{http_code} %{content_type} %{size_download}\n'
            head -c 2500 /tmp/r; echo
          fi
