name: Diagnóstico de fuentes

# Comprueba desde el runner (que sí tiene red) qué URLs responden y con qué formato.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnostico.yml"]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar GIRO scaled.php (ronda 3)
        run: |
          U=https://giro.uml.edu/didbase/scaled.php
          curl -sL --max-time 60 "$U" > /tmp/s.html
          echo "---- campos del formulario"
          grep -oiE '<(input|select|textarea)[^>]*>' /tmp/s.html | grep -v 'type="button"' | sort -u | head -80
          echo "---- opciones de estación con EA036"
          grep -oiE '<option[^>]*>[^<]*' /tmp/s.html | grep -iE 'EA036|ARENOSILLO' | head
          echo "---- opciones (muestra)"
          grep -oiE '<option[^>]*>[^<]*' /tmp/s.html | head -40
          echo "---- javascript inline relevante"
          grep -iE 'submit|ursi|station|char' /tmp/s.html | grep -v '<option' | head -40
          echo "---- POST de prueba"
          for extra in "ursiCode=EA036&charName=foF2" "ursiCode=EA036&charName[]=foF2" "ursiCode=EA036&foF2=on" "station=EA036&charName=foF2"; do
            echo "== $extra"
            curl -sL --max-time 90 -X POST "$U" --data "date_start=2026-09-20 00:00&date_end=2026-09-20 03:00&$extra&DMUF=3000" -o /tmp/p.html -w '%{http_code} %{size_download}\n'
            sed -e 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -iE -A12 'foF2|EA036|error|no data' | head -30
          done
