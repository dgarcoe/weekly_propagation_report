name: Diagnóstico de fuentes

# Genera un informe completo en el runner sin abrir PR, para comprobar que todas
# las fuentes responden. Se lanza a mano (Run workflow) o al tocar el código en
# una rama claude/**.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnostico.yml", "propagacion/**"]

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compilar e instalar voacapl
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gfortran automake autoconf
          git clone https://github.com/jawatson/voacapl.git /tmp/voacapl
          cd /tmp/voacapl
          git checkout c12a98b348c39f36f2659b8b3aa97b86284c8a1d
          autoreconf -fi
          ./configure -q
          make
          sudo make install
          makeitshfbc
          voacapl ~/itshfbc > /dev/null && echo "voacapl OK"
      - name: Generar informe de prueba (sin RBN)
        run: |
          python -m propagacion --sin-rbn --salida /tmp/informe 2>&1 | grep -E 'WARNING|ERROR|informe'
          echo "Secciones sin datos: $(grep -c '_Sin datos esta semana._' /tmp/informe/informe.md || true)"
          sed -n '/^## 1/,/^## 2/p' /tmp/informe/informe.md
          echo "### Informe de prueba" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/informe/informe.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: informe-prueba
          path: /tmp/informe
