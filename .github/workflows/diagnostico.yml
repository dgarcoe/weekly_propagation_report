name: Diagnóstico de fuentes

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnostico.yml"]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Productos de previsión solar de NOAA
        run: |
          S=https://services.swpc.noaa.gov
          p() { echo "=== $1"; curl -sL --max-time 60 "$S/$1" -o /tmp/r -w 'HTTP %{http_code} %{size_download}\n'; head -c ${2:-900} /tmp/r; echo; }
          p json/goes/primary/xrays-7-day.json 700
          python3 -c "import json;d=json.load(open('/tmp/r'));print(len(d));print(sorted({x.get('energy') for x in d}));print(d[0]['time_tag'],d[-1]['time_tag'])"
          p text/3-day-forecast.txt 4000
          p text/3-day-geomag-forecast.txt 1500
          p json/solar-cycle/predicted-solar-cycle.json 600
          python3 -c "import json;d=json.load(open('/tmp/r'));print(d[0].keys());[print(x) for x in d if x['time-tag']>='2026-08'][:8]" | head -12
          p text/27-day-outlook.txt 1500
          p products/solar-wind/plasma-7-day.json 300
          p json/solar-radio-flux.json 400
          p products/summary/10cm-flux.json 300
