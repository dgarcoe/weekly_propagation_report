name: Diagnóstico de fuentes

# Genera un informe completo en el runner (que sí tiene red) sin abrir PR,
# para comprobar que todas las fuentes responden.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnostico.yml", "propagacion/**"]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compilar e instalar voacapl
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gfortran automake autoconf
          git clone https://github.com/jawatson/voacapl.git /tmp/voacapl
          cd /tmp/voacapl
          git checkout c12a98b348c39f36f2659b8b3aa97b86284c8a1d
          autoreconf -fi
          ./configure -q
          make
          sudo make install
          makeitshfbc
          voacapl ~/itshfbc > /dev/null && echo "voacapl OK"
      - name: Generar informe de prueba
        run: |
          python -m propagacion --sin-rbn --salida /tmp/informe 2>&1 | grep -vE '^DEBUG'
          echo "Secciones sin datos: $(grep -c '_Sin datos esta semana._' /tmp/informe/informe.md || true)"
          ls -la /tmp/informe
          sed -n '/^## 3/,/^## 5/p' /tmp/informe/informe.md
