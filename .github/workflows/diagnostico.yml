name: Diagnóstico de fuentes

# Comprueba desde el runner (que sí tiene red) qué URLs responden y con qué formato.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnostico.yml"]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta real a GIRO scaled.php (ronda 4)
        run: |
          U=https://giro.uml.edu/didbase/scaled.php
          curl -sL --max-time 120 -X POST "$U" \
            --data-urlencode "location=EA036" --data-urlencode "chosenchars[]=0" \
            --data-urlencode "date_start=2026-09-20 00:00" --data-urlencode "date_end=2026-09-20 06:00" \
            --data-urlencode "DMUF=3000" --data-urlencode "query_submit=Search" \
            -o /tmp/p.html -w 'HTTP %{http_code} %{content_type} %{size_download}\n'
          echo "---- enlaces del resultado"
          grep -oiE '(href|src|action)="[^"]*"' /tmp/p.html | sort -u | grep -viE 'css|bootstrap|jquery|menuBar' | head -30
          echo "---- <pre> / tablas del resultado"
          python3 - <<'PY'
          import re
          h = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          i = h.find('query_submit')
          for m in re.finditer(r'<pre[^>]*>(.*?)</pre>', h, re.S | re.I):
              print('PRE:', m.group(1)[:1500])
          txt = re.sub(r'<[^>]+>', ' ', h[i:])
          txt = re.sub(r'[ \t]+', ' ', txt)
          lines = [l.strip() for l in txt.splitlines() if l.strip()]
          print('\n'.join(lines[-80:]))
          PY
