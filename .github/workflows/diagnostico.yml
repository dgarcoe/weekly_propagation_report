name: Diagnóstico de fuentes

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnostico.yml"]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: GIRO - semana completa frente a un día
        run: |
          B="https://lgdc.uml.edu/fastchar/getbest?ursiCode=EA036&DMUF=3000"
          C="charName=foF2,foF1,foEs,MUF(D),M(D),hmF2,fmin,FF,QF"
          p() { curl -s --max-time 300 -o /tmp/r -w "HTTP %{http_code} · %{time_total} s · %{size_download} B · $1\n" "$B&$2&$3"; grep -c '^20' /tmp/r || true; }
          p "semana, 9 magnitudes" "$C" "fromDate=2026/10/05+00:00:00&toDate=2026/10/12+00:00:00"
          p "1 día, 9 magnitudes" "$C" "fromDate=2026/10/05+00:00:00&toDate=2026/10/06+00:00:00"
          p "2 días, 9 magnitudes" "$C" "fromDate=2026/10/06+00:00:00&toDate=2026/10/08+00:00:00"
          p "semana, solo foF2" "charName=foF2" "fromDate=2026/10/05+00:00:00&toDate=2026/10/12+00:00:00"
          p "30 días, solo foF2" "charName=foF2" "fromDate=2026/09/05+00:00:00&toDate=2026/10/05+00:00:00"
